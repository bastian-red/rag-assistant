name: CI

# One job per lane. Each proves something the others cannot: the unit lane
# cannot see turbo stripping the environment, the e2e lane supplies its own
# environment and so cannot see it either, only dev-smoke boots the documented
# `pnpm dev`, and only integration runs the real Nest graph against real
# Postgres (pgvector) and Redis at the documented rate-limit budgets.
#
# No lane here runs a real model: GitHub's runners have no GPU and the models
# are gigabytes. Every lane uses the Ollama-compatible fake from @rag/llm,
# which is what makes them deterministic. Answer quality is measured by the
# eval lane (build step 8), against the real model.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The datastores every lane but quality and unit needs.
env:
  DATABASE_URL: postgresql://rag:rag@localhost:5445/rag?schema=public
  REDIS_URL: redis://localhost:6391

jobs:
  quality:
    name: Lint, typecheck, contracts, secrets, format, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so gitleaks scans every commit and not just the tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Self-tests first: a checker that has silently stopped checking passes
      # everything, and only a check on the checker can see that.
      - run: pnpm env:contract:self-test
      - run: pnpm env:contract
      - run: pnpm scan:invisible:self-test
      - run: pnpm scan:invisible
      - run: pnpm scan:self-import:self-test
      - run: node scripts/wait-for-api.mjs --self-test
      - run: pnpm scan:node-pin:self-test
      - run: pnpm scan:node-pin
      - run: pnpm scan:self-import
      - run: pnpm proofs:check
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm run scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,cjs,mjs,json}"
      # Runtime dependencies only, and only critical: a critical advisory in
      # anything that ships fails the build (next <=16.4.0 had two RCEs).
      - run: pnpm audit --prod --audit-level critical

  unit:
    name: Unit and design gates (UTC and Pacific/Kiritimati)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test
      # Twice, the second time at UTC+14: a formatter or an hour bucket that
      # assumed UTC passes the first run and fails here.
      - run: pnpm test
        env:
          TZ: Pacific/Kiritimati

  integration:
    name: Integration (schema guarantees, seed check, ingest, retrieval and its p95 bench, real Nest graph, documented budgets)
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-secret-at-least-32-characters-long
    services:
      postgres: &postgres
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ['5445:5432']
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis: &redis
        image: redis:7-alpine
        ports: ['6391:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: ./scripts/db-drift.sh
      # Seeds twice and digests both runs.
      - run: ./scripts/seed-check.sh
      - run: ./scripts/integration.sh

  dev-smoke:
    # Deliberately NO job-level datastore env reaching the app: the point of
    # this job is that the only configuration reaching the processes is the
    # .env file, through scripts/dev.sh, the way it does on a reader's machine.
    # (The workflow-level env is stripped by dev-smoke.sh's `env -u`.)
    name: pnpm dev serves api, ingest and web
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=|AUTH_SECRET=$(openssl rand -base64 32)|" .env
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      # The model server, at the .env.example address with both models listed:
      # dev.sh refuses to start without one, and that refusal is documented
      # behaviour. The fake stands in for `ollama serve`, nothing else changes.
      - name: Start the fake model server where .env points
        run: |
          pnpm exec turbo run build --filter=@rag/llm --output-logs=errors-only
          nohup node services/llm/dist/fake/main.js --port 11434 \
            --models "$(sed -n 's/^CHAT_MODEL=//p' .env),$(sed -n 's/^EMBED_MODEL=//p' .env)" \
            >/tmp/fake-ollama.log 2>&1 &
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://localhost:11434/api/version && break; sleep 0.1; done
          curl -sf http://localhost:11434/api/tags
      # Cold runner, nothing built: dev's ^build dependency has to do it all.
      - run: WAIT_SECONDS=300 ./scripts/dev-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-smoke-log
          path: /tmp/rag-dev-smoke.log
          retention-days: 7

  e2e:
    name: E2E (Lighthouse budgets, Playwright on Chromium + Firefox, axe in both schemes, 390 px)
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rag/e2e exec playwright install --with-deps chromium firefox
      - run: ./scripts/e2e.sh
      # The median run's report for every page, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: /tmp/rag-e2e/lighthouse
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: /tmp/rag-e2e
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  images:
    name: Docker images build (api, ingest, web)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The images job proves each Dockerfile builds; this one proves the compose
  # stack the README documents actually runs: migrate + seed from the api
  # image, then api, ingest and web healthy, then content only a working stack
  # can produce. The fake model server stands in for the host's Ollama at the
  # address compose uses by default (host.docker.internal:11434), so it binds
  # 0.0.0.0 rather than loopback.
  compose:
    name: docker compose --profile app runs the stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=|AUTH_SECRET=$(openssl rand -base64 32)|" .env
      - name: Start the fake model server where compose points
        run: |
          pnpm exec turbo run build --filter=@rag/llm --output-logs=errors-only
          nohup node services/llm/dist/fake/main.js --host 0.0.0.0 --port 11434 \
            --models "$(sed -n 's/^CHAT_MODEL=//p' .env),$(sed -n 's/^EMBED_MODEL=//p' .env)" \
            >/tmp/fake-ollama.log 2>&1 &
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://localhost:11434/api/version && break; sleep 0.1; done
          curl -sf http://localhost:11434/api/tags
      - name: docker compose --profile app up --build --wait
        run: docker compose -f infra/docker-compose.yml --profile app up -d --build --wait --wait-timeout 600
      - name: The stack answers with real content
        run: |
          set -euo pipefail
          curl -sf http://localhost:4600/health | tee /tmp/api-health.json | grep -q '"status":"ok","service":"api"'
          curl -sf http://localhost:4500/health | grep -q '"status":"ok","service":"ingest"'
          curl -sf http://localhost:3600/status | grep -q 'Every service is up'
          curl -sf http://localhost:3600/sign-in | grep -q 'Create an account'
          # The seed's files reach the worker through the shared volume: every
          # seeded document ends READY (a chunk count only ingest can write).
          for _ in $(seq 1 60); do
            ready=$(docker exec rag-postgres psql -U rag -d rag -tAc \
              "select count(*) from documents where status = 'READY'")
            total=$(docker exec rag-postgres psql -U rag -d rag -tAc 'select count(*) from documents')
            echo "documents READY: $ready / $total"
            [ "$total" -gt 0 ] && [ "$ready" = "$total" ] && exit 0
            sleep 2
          done
          exit 1
      - name: Compose logs
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml --profile app ps -a
          docker compose -f infra/docker-compose.yml --profile app logs --no-color --tail 200
          cat /tmp/fake-ollama.log
